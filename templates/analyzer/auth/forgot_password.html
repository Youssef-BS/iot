{% extends "analyzer/auth/base_auth.html" %}

{% block title %}Mot de passe oublié · AIDE-IoT{% endblock %}

{% block auth_content %}
<h1>Mot de passe oublié</h1>
<p class="lead">Saisissez votre adresse e-mail : vous recevrez un code de vérification à 6 chiffres.</p>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="email" class="form-label">Adresse e-mail</label>
        <input type="email" name="email" id="email" class="form-control"
               value="{{ email|default:'' }}" placeholder="exemple@email.com" required autofocus>
    </div>

    <button type="submit" class="ui-btn ui-btn-lg ui-btn-block">Envoyer le code</button>
</form>

<p class="auth-switch">
    <a href="{% url 'login' %}">← Retour à la connexion</a>
</p>
{% endblock %}
