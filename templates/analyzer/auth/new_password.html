{% extends "analyzer/auth/base_auth.html" %}

{% block title %}Nouveau mot de passe · AIDE-IoT{% endblock %}

{% block auth_content %}
<h1>Nouveau mot de passe</h1>
<p class="lead">Choisissez un nouveau mot de passe pour votre compte.</p>

<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="password1" class="form-label">Nouveau mot de passe</label>
        <input type="password" id="password1" name="password1" class="form-control"
               autocomplete="new-password" required autofocus>
    </div>

    <div class="form-group">
        <label for="password2" class="form-label">Confirmer le mot de passe</label>
        <input type="password" id="password2" name="password2" class="form-control"
               autocomplete="new-password" required>
    </div>

    <button type="submit" class="ui-btn ui-btn-lg ui-btn-block">Modifier le mot de passe</button>
</form>

<p class="auth-switch">
    <a href="{% url 'login' %}">← Retour à la connexion</a>
</p>
{% endblock %}
